[project]
name = "seed-vig-cnn"
version = "0.1.0"
description = "Multimodal EEG and EOG regression for the SEED-VIG dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
tracking = ["wandb>=0.17"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
